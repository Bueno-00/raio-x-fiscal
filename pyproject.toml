[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raio-x-fiscal"
version = "0.1.0"
description = "Plataforma de IA para o setor contabil sobre NF-e publicas: pipeline medalhao (DuckDB), baseline descricao -> NCM e auditoria de NCM."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rafael Bueno", email = "rafapbueno29@gmail.com" }]
dependencies = [
  "duckdb>=1.1",
  "pyarrow>=15",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
airflow = ["apache-airflow>=2.9,<3"]

[project.scripts]
rxf = "raio_x_fiscal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "dags"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
ignore = ["N806", "N803"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
