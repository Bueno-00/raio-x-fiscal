# raiox.zemploo.com.br: Raio-X Fiscal (app FastAPI no PM2 "raio-x-app", porta 8770 só local)
server {
    server_name raiox.zemploo.com.br;

    # o app aceita até 25 MB por envio; o Nginx corta um pouco acima
    client_max_body_size 26m;
    # nada de nota em arquivo temporário: o envio vai direto para o app (que lê na memória)
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    # o app não guarda log de acesso; aqui também não
    access_log off;

    location / {
        limit_req zone=general burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen 80;
}
